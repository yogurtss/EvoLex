[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evolex"
version = "0.3.0"
description = "Evidence-governed multi-agent platform for joint knowledge-graph extraction and controlled self-evolution."
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "langgraph>=0.2",
  "openai>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]
rich = [
  "rich>=13",
]

[project.scripts]
evolex = "evolex.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (e2e tests with real API calls)",
]
